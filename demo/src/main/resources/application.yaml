spring:
  application:
    name: demo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8081

# health/info/metrics only - not the full actuator surface (env, beans,
# configprops, etc. can leak secrets/internals and stay unexposed here).
# show-details: when-authorized + roles: ADMIN means an anonymous caller
# hitting the permitAll'd /actuator/health (SecurityConfig) only ever sees
# {"status":"UP"}; the per-component breakdown (db, diskSpace, ...) only
# appears for a request already authenticated as ADMIN. probes.enabled adds
# the /actuator/health/liveness and /readiness groups - the standard
# Kubernetes-style split between "is the process alive" and "is it ready to
# take traffic" (readiness includes the DB check, liveness doesn't).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true

taskflow:
  default-page-size: 20
  max-page-size: 100

# 1h, not a "remember me for weeks" duration: this is a demo project with no
# refresh-token flow yet, so the tradeoff is short-and-annoying-to-retest vs.
# long-and-a-stolen-token-stays-valid-for-ages. 1h favors safety while still
# being long enough to not expire mid-demo/mid-Postman-run. A real production
# setup would likely go shorter (5-15m) paired with a refresh token.
jwt:
#  secret: ${JWT_SECRET}
  secret: test-secret-key-obviously-fake-but-32-chars-plus
  expiration: 1h

# Placeholder host - nothing is actually listening here yet, and nothing in
# this app calls ProductivityTipClient yet either. Step W.2 points this at
# WireMock instead.
productivity-tips:
  base-url: http://localhost:9999
  connect-timeout: 2s
  read-timeout: 2s
