spring:
  application:
    name: demo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8081

taskflow:
  default-page-size: 20
  max-page-size: 100

# 1h, not a "remember me for weeks" duration: this is a demo project with no
# refresh-token flow yet, so the tradeoff is short-and-annoying-to-retest vs.
# long-and-a-stolen-token-stays-valid-for-ages. 1h favors safety while still
# being long enough to not expire mid-demo/mid-Postman-run. A real production
# setup would likely go shorter (5-15m) paired with a refresh token.
jwt:
  secret: ${JWT_SECRET}
  expiration: 1h
